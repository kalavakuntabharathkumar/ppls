services:
  api:
    build: ./backend
    ports: ["8000:8000"]
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports: ["8123:8123","9000:9000"]
  frontend:
    image: node:20
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [api]
